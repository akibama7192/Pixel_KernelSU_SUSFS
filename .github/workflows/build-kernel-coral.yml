name: Compile My Custom Pixel Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

      - name: Download Proton Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          RAW_URL="https://github.com/kdrag0n/proton-clang"
          git clone --depth=1 "$(echo "$RAW_URL" | tr -d ' ')" clang

      - name: Clone Kernel Source
        run: |
          RAW_URL="https://github.com/freak07/FLORAL"
          # Убрали -b android-13.0, чтобы клонировать ветку по умолчанию (master)
          git clone --depth=1 "$(echo "$RAW_URL" | tr -d ' ')" $GITHUB_WORKSPACE/kernel

      - name: Clone Dependencies & Patches
        run: |
          cd $GITHUB_WORKSPACE
          
          # Скачиваем AnyKernel3 (главную ветку)
          RAW_AK3="https://github.com/WildKernels/AnyKernel3.git"
          git clone "$(echo "$RAW_AK3" | tr -d ' ')" AnyKernel3

          # Скачиваем патчи SUSFS
          RAW_SUSFS="https://gitlab.com/simonpunk/susfs4ksu.git"
          git clone "$(echo "$RAW_SUSFS" | tr -d ' ')" -b kernel-4.14 susfs_source

          # Скачиваем скрипты автоматизации WildKernels
          RAW_PATCHES="https://github.com/WildKernels/kernel_patches.git"
          git clone "$(echo "$RAW_PATCHES" | tr -d ' ')" kernel_patches

      - name: Setup KernelSU & Fix Patch Paths
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # 1. Скачиваем официальный KernelSU, переключаясь на финальную non-GKI версию v0.9.5 вместо удаленной legacy
          RAW_KSU="https:// github.com / tiann / KernelSU"
          git clone --depth=1 "$(echo "$RAW_KSU" | tr -d ' ')" KernelSU-Source
          cd KernelSU-Source && git fetch --tags && git checkout v0.9.5 && cd ..
          
          # 2. Переносим исходники в структуру драйверов ядра
          cp -r KernelSU-Source/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          rm -rf KernelSU-Source

          # 3. Обманываем автоматику WildKernels: создаем для нее ожидаемую папку "next"
          mkdir -p $GITHUB_WORKSPACE/kernel_patches/next
          if [ -f "$GITHUB_WORKSPACE/kernel_patches/KernelSU/ksu_susfs.patch" ]; then
            cp $GITHUB_WORKSPACE/kernel_patches/KernelSU/ksu_susfs.patch $GITHUB_WORKSPACE/kernel_patches/next/0001-kernel-patch-susfs-v1.5.5-to-KernelSU-Next-v1.0.5.patch || true
          fi

          # 4. Раскладываем файлы самого SUSFS туда, где их ожидает скрипт автоматизации
          cp $GITHUB_WORKSPACE/susfs_source/kernel-4.14/fs/susfs/* fs/susfs/ || true
          cp $GITHUB_WORKSPACE/susfs_source/kernel-4.14/include/linux/susfs.h include/linux/ || true

      - name: Apply Patches
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # Запуск оригинального патчера автоматики под видом конфигурации coral
          echo "Applying SUSFS and KernelSU patches..."
          bash $GITHUB_WORKSPACE/kernel_patches/patch.sh coral || true

      - name: Configure Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # Принудительно включаем модули в конфиг ядра Pixel 4 XL
          echo "CONFIG_KSU=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_AUTO_ADD_SUS_PROCMEM=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_SECURE_MKDIR_AND_INODELS=y" >> arch/arm64/configs/floral_defconfig
          
          # Убираем конфликтующие флаги оптимизаций Clang
          find . -name "Makefile*" -exec sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' {} + || true
          sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' Makefile || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' arch/arm64/configs/floral_defconfig || true

      - name: Compile Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:/usr/bin:/bin:$PATH"
          
          MAKE_ARGS="O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=gcc HOSTLD=/usr/bin/ld LD=ld.lld"
          
          make $MAKE_ARGS floral_defconfig
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS Image -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          zip -r9 ../Krisakura-KSU-Coral.zip *

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Flashable
          path: Krisakura-KSU-Coral.zip
