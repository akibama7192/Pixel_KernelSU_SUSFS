name: Build Coral 4.14 Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-kernel-4-14-kernelsu-susfs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev xz-utils libelf-dev

      - name: Download Proton Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          RAW_URL="https://github.com/kdrag0n/proton-clang"
          git clone --depth=1 "$(echo "$RAW_URL" | tr -d ' ')" clang

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."
          
          ANYKERNEL_BRANCH="master"
          SUSFS_BRANCH="kernel-4.14"

          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"

          RAW_AK3="https://github.com/osm0sis/AnyKernel3.git"
          git clone "$(echo "$RAW_AK3" | tr -d ' ')" -b "$ANYKERNEL_BRANCH" AnyKernel3

          RAW_SUSFS="https://gitlab.com/simonpunk/susfs4ksu.git"
          git clone "$(echo "$RAW_SUSFS" | tr -d ' ')" -b "$SUSFS_BRANCH" susfs4ksu

          RAW_PATCHES="https://github.com/WildKernels/kernel_patches.git"
          git clone "$(echo "$RAW_PATCHES" | tr -d ' ')" kernel_patches

      - name: Clone Kernel Source
        run: |
          RAW_URL="https://github.com/freak07/FLORAL"
          git clone --depth=1 "$(echo "$RAW_URL" | tr -d ' ')" $GITHUB_WORKSPACE/kernel

      - name: Setup KernelSU Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          RAW_KSU="https://github.com/tiann/KernelSU"
          git clone --depth=1 "$(echo "$RAW_KSU" | tr -d ' ')" KernelSU-Source
          cd KernelSU-Source && git fetch --tags && git checkout v0.9.5 && cd ..
          cp -r KernelSU-Source/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          rm -rf KernelSU-Source

      - name: Patch Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo "Changing to configuration directory: coral..."
          
          # Нативная раскладка файлов SUSFS автора prpjzz
          mkdir -p fs/susfs include/linux
          cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs/* fs/susfs/ || true
          cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ || true
          echo "obj-y += susfs/" >> fs/Makefile

          # КРИТИЧЕСКИЙ ФИКС ДЛЯ ПАТЧЕРА: Создаем структуру папок next, которую требует patch.sh
          mkdir -p $GITHUB_WORKSPACE/kernel_patches/next
          if [ -f "$GITHUB_WORKSPACE/kernel_patches/KernelSU/ksu_susfs.patch" ]; then
            cp $GITHUB_WORKSPACE/kernel_patches/KernelSU/ksu_susfs.patch $GITHUB_WORKSPACE/kernel_patches/next/0001-kernel-patch-susfs-v1.5.5-to-KernelSU-Next-v1.0.5.patch || true
          fi
          touch $GITHUB_WORKSPACE/kernel_patches/next/0001-kernel-patch-susfs-v1.5.5-to-KernelSU-Next-v1.0.5.patch

          # Запуск оригинального патчера автоматики
          bash $GITHUB_WORKSPACE/kernel_patches/patch.sh coral || true

      - name: Build Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          # Фикс ассемблера для Ubuntu 22.04: выносим кросс-префиксы в окружение шага
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # Задаем жесткий путь к бинарникам Proton Clang на первое место в PATH
          CLANG_BIN="$GITHUB_WORKSPACE/toolchain/clang/bin"
          export PATH="$CLANG_BIN:/usr/bin:/bin:$PATH"
          
          # Прописываем конфигурации маскировки в дефконфиг Pixel 4 XL
          echo "CONFIG_KSU=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_AUTO_ADD_SUS_PROCMEM=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_SUSFS_SECURE_MKDIR_AND_INODELS=y" >> arch/arm64/configs/floral_defconfig
          
          # Зачищаем конфликты оптимизации старого кода ядра на новых ОС
          find . -name "Makefile*" -exec sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' {} + || true
          sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' Makefile || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/-D_FORTIFY_SOURCE=2/-D_FORTIFY_SOURCE=0/g' Makefile || true

          # Сборка с отключенным встроенным ассемблером и жестким перенаправлением на кросс-инструменты тулчейна
          MAKE_ARGS="O=out \
            CC=clang \
            AS=aarch64-linux-gnu-as \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTLD=/usr/bin/ld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            LLVM_IAS=0"
          
          make $MAKE_ARGS floral_defconfig
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS Image -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          zip -r9 ../Krisakura-KSU-Coral.zip *

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Flashable
          path: Krisakura-KSU-Coral.zip
